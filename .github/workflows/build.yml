name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (24 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CluaNote ${{ github.ref_name }}'
          releaseBody: |
            ## CluaNote ${{ github.ref_name }}

            A fast, minimalist, dark glassmorphic desktop task planner.

            ### Download

            | Platform | File | Notes |
            |---|---|---|
            | **Windows** | `cluanote_*_x64-setup.exe` | NSIS installer (recommended) |
            | **Windows** | `cluanote_*_x64_en-US.msi` | MSI installer |
            | **macOS (Apple Silicon)** | `cluanote_*_aarch64.dmg` | M1/M2/M3 Macs |
            | **macOS (Intel)** | `cluanote_*_x64.dmg` | Intel Macs |
            | **Linux** | `cluanote_*_amd64.AppImage` | Universal Linux (recommended) |
            | **Linux** | `cluanote_*_amd64.deb` | Debian / Ubuntu |

            ### Requirements
            - **Windows**: WebView2 Runtime (pre-installed on Windows 10/11)
            - **macOS**: macOS 10.15+
            - **Linux**: A compositor for glass transparency effect
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
