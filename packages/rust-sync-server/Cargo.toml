[package]
name = "cluanote-sync-server"
version = "0.4.6"
edition = "2021"
description = "Lightweight cross-platform sync server for CluaNote"
authors = ["Subham Maity <https://github.com/Subham-Maity>"]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
hex = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
dirs = "5"
